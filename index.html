<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站建设中</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1c1b19;
    --paper: #ece7dd;
    --line: #c9c2b3;
    --accent: #3d5a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .frame {
    width: 100%;
    max-width: 640px;
    border: 1px solid var(--line);
    padding: 64px 48px;
    position: relative;
  }

  .frame::before,
  .frame::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid var(--ink);
  }
  .frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .frame::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  p {
    font-size: 15.5px;
    line-height: 1.7;
    max-width: 46ch;
    color: #4a453d;
  }

  .rule {
    width: 100%;
    height: 1px;
    background: var(--line);
    margin: 40px 0;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    color: #6b665c;
  }

  .meta span:first-child {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
  }

  @media (max-width: 520px) {
    .frame { padding: 48px 28px; }
    .meta { flex-direction: column; gap: 8px; align-items: flex-start; }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="eyebrow">此处即将开放</div>
    <h1>页面正在<em>筹备</em>之中。</h1>
    <p>我们正在整理内容，很快便会呈现。感谢您的耐心，欢迎稍后再来看看。</p>

    <div class="rule"></div>

    <div class="meta">
      <span>敬请期待</span>
      <span id="today"></span>
    </div>
  </div>

  <script>
    document.getElementById('today').textContent =
      new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  </script>

</body>
</html>
