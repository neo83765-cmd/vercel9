<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈亦帆 · 设计师</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1a1a18;
    --paper: #faf9f6;
    --line: #ddd8cd;
    --accent: #2f4858;
    --muted: #6f6a5f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---- Header / nav ---- */
  header {
    border-bottom: 1px solid var(--line);
  }

  .nav-row {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .mark {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    letter-spacing: 0.01em;
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    margin-left: 28px;
  }

  nav a:hover { color: var(--ink); }

  /* ---- Hero ---- */
  .hero {
    padding: 96px 0 88px;
  }

  .hero .role {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 20px;
  }

  .hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 5.5vw, 3.6rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    max-width: 14ch;
    margin-bottom: 28px;
  }

  .hero p {
    font-size: 16px;
    color: var(--muted);
    max-width: 48ch;
  }

  /* ---- Skills ---- */
  section {
    padding: 64px 0;
    border-top: 1px solid var(--line);
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 40px;
  }

  .section-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
  }

  .section-head span {
    font-size: 13px;
    color: var(--muted);
  }

  .skill-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 16px;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
  }

  .skill-row:last-child { border-bottom: none; }

  .skill-name {
    font-size: 16px;
  }

  .skill-desc {
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }

  .skill-level {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--line);
  }

  .dot.filled { background: var(--accent); }

  /* ---- Footer ---- */
  footer {
    border-top: 1px solid var(--line);
    padding: 36px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
  }

  footer a {
    color: var(--ink);
    text-decoration: none;
  }

  @media (max-width: 560px) {
    .nav-row { flex-direction: column; align-items: flex-start; gap: 12px; }
    nav a { margin-left: 0; margin-right: 20px; }
    .hero { padding: 64px 0 56px; }
    .skill-row { grid-template-columns: 1fr; gap: 8px; }
    footer { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body>

  <header>
    <div class="nav-row">
      <div class="mark">陈亦帆</div>
      <nav>
        <a href="#skills">专长</a>
        <a href="#contact">联系</a>
      </nav>
    </div>
  </header>

  <div class="wrap">

    <section class="hero" style="border-top:none;">
      <div class="role">视觉设计师 / 品牌顾问</div>
      <h1>用清晰的设计，讲明白复杂的事。</h1>
      <p>专注于品牌视觉与数字产品设计，擅长把模糊的想法整理成有条理、可执行的设计语言。</p>
    </section>

    <section id="skills">
      <div class="section-head">
        <h2>专长</h2>
        <span>Skills</span>
      </div>

      <div class="skill-row">
        <div>
          <div class="skill-name">品牌视觉设计</div>
          <div class="skill-desc">标志、视觉识别系统、品牌手册</div>
        </div>
        <div class="skill-level">
          <span class="dot filled"></span><span class="dot filled"></span>
          <span class="dot filled"></span><span class="dot filled"></span><span class="dot"></span>
        </div>
      </div>

      <div class="skill-row">
        <div>
          <div class="skill-name">UI / 产品设计</div>
          <div class="skill-desc">网页与移动端界面设计、设计系统搭建</div>
        </div>
        <div class="skill-level">
          <span class="dot filled"></span><span class="dot filled"></span>
          <span class="dot filled"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <div class="skill-row">
        <div>
          <div class="skill-name">排版与编辑设计</div>
          <div class="skill-desc">刊物、画册、活动物料排版</div>
        </div>
        <div class="skill-level">
          <span class="dot filled"></span><span class="dot filled"></span>
          <span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span>
        </div>
      </div>

      <div class="skill-row">
        <div>
          <div class="skill-name">插画与视觉叙事</div>
          <div class="skill-desc">概念插画、编辑插图</div>
        </div>
        <div class="skill-level">
          <span class="dot filled"></span><span class="dot filled"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </section>

  </div>

  <footer id="contact">
    <div class="wrap" style="display:flex; justify-content:space-between; width:100%; padding:0 32px;">
      <span>© 2026 陈亦帆</span>
      <a href="mailto:hello@example.com">hello@example.com</a>
    </div>
  </footer>

</body>
</html>
